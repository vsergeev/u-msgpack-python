name: Tests

on:
  - push
  - pull_request

jobs:
  build:

    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "2.7"
            container: python:2.7
            toxenv: py27
          - python-version: "3.5"
            container: python:3.5
            toxenv: py35
          - python-version: "3.6"
            container: python:3.6
            toxenv: py36,mypy
          - python-version: "3.7"
            container: python:3.7
            toxenv: py37,mypy
          - python-version: "3.8"
            toxenv: py38,mypy
          - python-version: "3.9"
            toxenv: py39,mypy
          - python-version: "3.10"
            toxenv: py310,mypy
          - python-version: "3.11"
            toxenv: py311,mypy
          - python-version: "3.12"
            toxenv: py312,mypy
          - python-version: "3.13"
            toxenv: py313,mypy
          - python-version: "3.14"
            toxenv: py314,mypy
          - python-version: "3.15"
            toxenv: py315,mypy
          - python-version: "pypy2.7"
            container: pypy:2.7
            toxenv: pypy2
          - python-version: "pypy3.9"
            toxenv: pypy3
          - python-version: "pypy3.10"
            toxenv: pypy3
          - python-version: "pypy3.11"
            toxenv: pypy3
          - python-version: "pypy3.12"
            toxenv: pypy3

    container: ${{ matrix.container }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      if: ${{ !matrix.container }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install tox
    - name: Test with tox
      run: tox -e ${{ matrix.toxenv }}
